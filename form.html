<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 - Product review | Yeikob Valverde 2026">
    <meta name="author" content="Yeikob Valverde">
    <title>Product Review | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>


            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">

                    <div class="star">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">☆</label>
                    </div>

                    <div class="star">
                        <input type="radio" id="rating2" name="rating" value="2">
                        <label for="rating2">☆☆</label>
                    </div>

                    <div class="star">
                        <input type="radio" id="rating3" name="rating" value="3">
                        <label for="rating3">☆☆☆</label>
                    </div>

                    <div class="star">
                        <input type="radio" id="rating4" name="rating" value="4">
                        <label for="rating4">☆☆☆☆</label>
                    </div>

                    <div class="star">
                        <input type="radio" id="rating5" name="rating" value="5">
                        <label for="rating5">☆☆☆☆☆</label>
                    </div>

                </div>
            </fieldset>


            <label for="date">Date of Installation</label>
            <input type="date" id="date" name="date" required>


            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                    <br>
                    <span>(Check all that apply)</span>
                </legend>

                <label class="checkbox">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    Durability
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="ease" name="features" value="ease of use">
                    Ease of Use
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>

                <label class="checkbox">
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>

            </fieldset>


            <label for="review">
                Written Review
                <span>(Optional)</span>
            </label>

            <textarea id="review" name="review"></textarea>


            <label for="name">
                Your Name
                <span>(Optional)</span>
            </label>

            <input type="text" id="name" name="name">


            <input type="submit" value="Post Review">

        </form>
    </main>


    <footer>
        <p>&copy; <span id="currentYear"></span> Yeikob Valverde | Peru</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
